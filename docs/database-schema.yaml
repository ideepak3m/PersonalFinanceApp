# Personal Finance Database Schema
# Schema: personal_finance
# Database: Supabase (PostgreSQL)
# Last Updated: Auto-generated from SupabaseTableSchema.md

schema: personal_finance
database: supabase
version: "1.0"

# ============================================================
# CORE TABLES
# ============================================================

tables:
  # ------------------------------------------------------------
  # ACCOUNTS - Bank accounts, credit cards, etc.
  # ------------------------------------------------------------
  accounts:
    description: "User bank accounts, credit cards, and other financial accounts"
    columns:
      id:
        type: bigint
        primary_key: true
        auto_increment: true
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      name:
        type: text
        nullable: false
      type:
        type: text
        nullable: false
        enum: [checking, savings, credit_card, investment, loan]
      institution:
        type: text
      account_number:
        type: text
      currency:
        type: text
        default: "CAD"
      balance:
        type: numeric(12,2)
        default: 0
      is_active:
        type: boolean
        default: true
      opened_date:
        type: date
      closed_date:
        type: date
      notes:
        type: text
      created_at:
        type: timestamp with time zone
        default: now()
      updated_at:
        type: timestamp with time zone
        default: now()
      country:
        type: text
        default: "CA"

  # ------------------------------------------------------------
  # TRANSACTIONS - Financial transactions from all accounts
  # ------------------------------------------------------------
  transactions:
    description: "All financial transactions (income, expenses, transfers)"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      date:
        type: date
        nullable: false
      raw_merchant_name:
        type: text
        nullable: false
        description: "Original merchant name from statement"
      normalized_merchant_id:
        type: uuid
        foreign_key: merchant(id)
        description: "Link to normalized merchant for categorization"
      amount:
        type: numeric(12,2)
        nullable: false
      currency:
        type: text
        nullable: false
      is_split:
        type: boolean
        default: false
        description: "True if transaction is split across multiple categories"
      notes:
        type: text
      category_id:
        type: uuid
        foreign_key: category(id)
        on_delete: set null
      description:
        type: text
      memo:
        type: text
      type:
        type: text
        enum: [income, expense, transfer]
      account_id:
        type: bigint
        foreign_key: accounts(id)
        on_delete: set null
      chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
        on_delete: set null
      split_chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
        on_delete: set null
      product_id:
        type: uuid
      status:
        type: text
        default: "pending_merchant_mapping"
        enum: [pending_merchant_mapping, categorized, reviewed]
      inserted_at:
        type: timestamp with time zone
        default: now()
      updated_at:
        type: timestamp with time zone
        default: now()

  # ------------------------------------------------------------
  # TRANSACTION_SPLIT - Split transactions across categories
  # ------------------------------------------------------------
  transaction_split:
    description: "Split transaction amounts across multiple categories/chart of accounts"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      transaction_id:
        type: uuid
        foreign_key: transactions(id)
        on_delete: cascade
      category_id:
        type: uuid
        foreign_key: category(id)
      amount:
        type: numeric(12,2)
        nullable: false
      percentage:
        type: numeric(5,2)
      belief_tag:
        type: text
      chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
      description:
        type: text
      user_id:
        type: uuid
      inserted_at:
        type: timestamp with time zone
        default: now()

  # ------------------------------------------------------------
  # CATEGORY - Transaction categories
  # ------------------------------------------------------------
  category:
    description: "Transaction categories for classification"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      name:
        type: text
        nullable: false
      parent_id:
        type: uuid
        foreign_key: category(id)
        description: "Self-reference for subcategories"
      type:
        type: text
        enum: [income, expense]
      icon:
        type: text
      color:
        type: text
      is_system:
        type: boolean
        default: false
      created_at:
        type: timestamp with time zone
        default: now()

  # ------------------------------------------------------------
  # CHART_OF_ACCOUNTS - Accounting classification
  # ------------------------------------------------------------
  chart_of_accounts:
    description: "Chart of accounts for proper accounting classification (Income/Expense types)"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      code:
        type: text
        nullable: false
        description: "Account code (e.g., 4000, 5000)"
      name:
        type: text
        nullable: false
      type:
        type: text
        nullable: false
        enum: [income, expense, asset, liability, equity]
      description:
        type: text
      is_system:
        type: boolean
        default: false
      is_active:
        type: boolean
        default: true
      parent_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
      display_order:
        type: integer
        default: 0
      created_at:
        type: timestamp with time zone
        default: now()
      updated_at:
        type: timestamp with time zone
        default: now()
    indexes:
      - name: idx_coa_user_type
        columns: [user_id, type]

  # ------------------------------------------------------------
  # MERCHANT - Normalized merchant names
  # ------------------------------------------------------------
  merchant:
    description: "Normalized merchant names for consistent categorization"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      name:
        type: text
        nullable: false
        description: "Normalized merchant name"
      category_id:
        type: uuid
        foreign_key: category(id)
      chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
        description: "Default chart of account for this merchant"
      is_subscription:
        type: boolean
        default: false
      is_recurring:
        type: boolean
        default: false
      logo_url:
        type: text
      website:
        type: text
      created_at:
        type: timestamp with time zone
        default: now()
      updated_at:
        type: timestamp with time zone
        default: now()

  # ------------------------------------------------------------
  # DESCRIPTION_RULES - Auto-categorization rules
  # ------------------------------------------------------------
  description_rules:
    description: "Rules for auto-categorizing transactions based on description patterns"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      pattern:
        type: text
        nullable: false
        description: "Regex or text pattern to match"
      match_type:
        type: text
        default: "contains"
        enum: [contains, starts_with, ends_with, exact, regex]
      merchant_id:
        type: uuid
        foreign_key: merchant(id)
        on_delete: cascade
      category_id:
        type: uuid
        foreign_key: category(id)
      chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
      priority:
        type: integer
        default: 0
      is_active:
        type: boolean
        default: true
      created_at:
        type: timestamp with time zone
        default: now()
      updated_at:
        type: timestamp with time zone
        default: now()

  # ------------------------------------------------------------
  # MERCHANT_SPLIT_RULES - Default split rules per merchant
  # ------------------------------------------------------------
  merchant_split_rules:
    description: "Default transaction split rules for specific merchants"
    columns:
      id:
        type: uuid
        primary_key: true
        default: gen_random_uuid()
      user_id:
        type: uuid
        foreign_key: auth.users(id)
        on_delete: cascade
      merchant_id:
        type: uuid
        foreign_key: merchant(id)
        on_delete: cascade
      chart_of_account_id:
        type: uuid
        foreign_key: chart_of_accounts(id)
      percentage:
        type: numeric(5,2)
        nullable: false
      is_active:
        type: boolean
        default: true
      created_at:
        type: timestamp with time zone
        default: now()

# ============================================================

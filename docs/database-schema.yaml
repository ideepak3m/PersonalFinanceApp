  investment_hierarchy:
    description: "Investment data hierarchy"
    flow: "user -> investment_accounts -> holdings/investment_transactions -> holding_snapshots"

  property_hierarchy:
    description: "Property and mortgage hierarchy"
    flow: "user -> properties -> mortgages -> mortgage_terms -> mortgage_payments"

  insurance_hierarchy:
    description: "Insurance data hierarchy"
    flow: "user -> insurance_policies -> [insurance_riders, insurance_nominees, insurance_premium_payments, insurance_bonus_history]"

  transaction_categorization:
    description: "Transaction categorization chain"
    flow: "transactions -> normalized_merchant_id -> merchant -> chart_of_account_id/category_id"
    rules:
      - "description_rules matches raw_merchant_name to merchant"
      - "merchant has default chart_of_account_id for auto-categorization"
      - "transaction_split allows splitting across multiple chart_of_accounts"

